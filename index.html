<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/header.css">
    <link rel="stylesheet" href="css/banner.css">
    <title>Sotbit</title>
</head>

<body>
    <header class="header">
        <nav class="nav">
            <div class="left-header-menu">
                <img class="hamburger" src="images/burger_menu.svg" alt="Burger Menu">
                <img src="images/logo.svg" alt="sotbit logo">
                <div class="country-selector">
                    <p>Россия</p>
                    <img src="images/russia.svg" alt="russia">
                    <img class="arrow" src="images/arrow_down.svg" alt="arrow_down">
                </div>
            </div>
            <div class="right-header-menu">
                <div class="contacts">
                    <div class="contacts-phone">
                        <p>+7 (495) 278-08-54</p>
                        <img src="images/arrow_down.svg" alt="arrow_down">
                    </div>
                    <p>Заказать обратный звонок</p>
                </div>
                <a href="#" class="nav-button">Оставить заявку</a>
                <div class="nav-icons">
                    <img src="images/icons/search.svg" alt="Search">
                    <img src="images/icons/Support.svg" alt="Support">
                    <img src="images/icons/Basket.svg" alt="Basket"><span class="basket-badge">0</span>
                    <img src="images/icons/User.svg" alt="User">
                </div>
            </div>
        </nav>
    </header>

    <div class="banner">
        <div class="banner-info">
            <div class="banner-text">
                <h1 class="banner-title"><span>Разработка и внедрение</span><br>B2B платформы на Битрикс</h1>
                <ol class="banner-list">
                    <li>Быстрый запуск B2B платформы за одну неделю;</li>
                    <li>Гарантия качественного выполнения работ точно в срок;</li>
                    <li>Возможность доработки под задачи Вашего бизнеса.</li>
                </ol>
            </div>
            <button class="banner-button">
                <p>Подробнее</p>
                <img src="images/arrow_right-top.png" alt="Arrow Right Top">
            </button>
        </div>
        <div class="slider">
            <div class="slide active"></div>
            <div class="slide"></div>
            <div class="slide"></div>
            <div class="slide"></div>
        </div>
        <div class="slider-arrow">
            <img src="images/arrow_left_grey.svg" alt="Arrow Left">
            <img src="images/arrow_right_grey.svg" alt="Arrow Right">
        </div>
    </div>
</body>

</html>
