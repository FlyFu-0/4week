<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/header.css">
    <link rel="stylesheet" href="css/banner.css">
    <title>Sotbit</title>
</head>

<body>
    <header class="header">
        <nav class="nav">
            <div class="left-header-menu">
                <img class="hamburger" src="images/burger_menu.svg" alt="Burger Menu">
                <img src="images/logo.svg" alt="sotbit logo">
                <div class="country-selector">
                    <p>Россия</p>
                    <img src="images/russia.svg" alt="russia">
                    <img class="arrow" src="images/arrow_down.svg" alt="arrow_down">
                </div>
            </div>
            <div class="right-header-menu">
                <div class="contacts">
                    <div class="contacts-phone">
                        <p>+7 (495) 278-08-54</p>
                        <img src="images/arrow_down.svg" alt="arrow_down">
                    </div>
                    <p>Заказать обратный звонок</p>
                </div>
                <a href="#" class="nav-button">Оставить заявку</a>
                <div class="nav-icons">
                <img src="images/icons/search.svg" alt="Search"></li>
                <img src="images/icons/Support.svg" alt="Support"></li>
                <img src="images/icons/Basket.svg" alt="Basket"><span class="basket-badge">0</span></li>
                <img src="images/icons/User.svg" alt="User"></li>
            </div>
            </div>
        </nav>
    </header>

    <div class="banner"></div>
</body>

</html>
